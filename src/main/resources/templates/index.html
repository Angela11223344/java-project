<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>⛅Java Weather App by A Evans⛅</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" type="text/css" href="/css/index.css">
</head>
<body style="background-image: url('/images/image.png'); background-size: auto;">
<div class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="/login">Login</a>
        </div>

    </div>
</div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="card-title text-center">☀️Weather App☀️</h1>
                    <form th:action="@{/weather}" method="post">
                        <div class="form-group">
                            <label>
                                <input type="text" id="city" class="form-control" name="city" placeholder="Enter city name">
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Get Weather</button>
                        <div class="card-body">
                            <div class="card-title text-center">
                                <h2>⛅Popular Cities⛅</h2>
                                <form th:action="@{/weather}" method="post" style="display:inline;">
                                    <input type="hidden" name="city" value="Perth" />
                                    <button type="submit" class="btn btn-secondary">Perth</button>
                                </form>

                                <form th:action="@{/weather}" method="post" style="display:inline;">
                                    <input type="hidden" name="city" value="Rome" />
                                    <button type="submit" class="btn btn-secondary">Rome</button>
                                </form>

                                <form th:action="@{/weather}" method="post" style="display:inline;">
                                    <input type="hidden" name="city" value="New York" />
                                    <button type="submit" class="btn btn-secondary">New York</button>
                                </form>

                                <form th:action="@{/weather}" method="post" style="display:inline;">
                                    <input type="hidden" name="city" value="Sydney" />
                                    <button type="submit" class="btn btn-secondary">Sydney</button>
                                </form>

                                <form th:action="@{/weather}" method="post" style="display:inline;">
                                    <input type="hidden" name="city" value="Manila" />
                                    <button type="submit" class="btn btn-secondary">Manila</button>
                                </form>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
